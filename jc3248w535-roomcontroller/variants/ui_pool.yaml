font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 56
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_value
    size: 40
    bpp: 4

lvgl:
  draw_rounding: 16
  displays: my_display
  touchscreens: my_touch

  bg_color: 0xF2F3F5
  border_width: 0
  outline_width: 0

  pages:
    - id: main_page
      layout:
        type: grid
        grid_columns: [235, 235]
        grid_rows: [30, 90, 90, 90]
        grid_column_align: CENTER
        grid_row_align: CENTER

      widgets:
        # -------------------------
        # TOP BAR
        # Keep IDs compatible with your current structure
        # -------------------------
        - obj:
            id: top_bar
            grid_cell_column_pos: 0
            grid_cell_row_pos: 0
            grid_cell_column_span: 2
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH

            bg_color: 0xF2F3F5
            border_width: 0
            pad_left: 12
            pad_right: 12
            pad_top: 8
            pad_bottom: 8
            scrollable: false
            scrollbar_mode: "OFF"

            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_BETWEEN
              flex_align_cross: CENTER
              flex_align_track: CENTER

            widgets:
              - label:
                  id: lbl_time
                  text: "--:--"
                  text_color: 0x111827

              - obj:
                  bg_opa: TRANSP
                  border_width: 0
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: END
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                  widgets:
                    - label:
                        id: lbl_temp
                        text: ""
                        text_color: 0x111827

                    - label:
                        id: lbl_hum
                        text: ""
                        text_color: 0x6B7280

                    # Keep reserve buttons so shared logic won't break
                    - button:
                        id: btn_5
                        checkable: true
                        width: 1
                        height: 1
                        bg_opa: TRANSP
                        border_width: 0

                    - button:
                        id: btn_6
                        checkable: true
                        width: 1
                        height: 1
                        bg_opa: TRANSP
                        border_width: 0

                    - button:
                        id: btn_7
                        checkable: true
                        width: 1
                        height: 1
                        bg_opa: TRANSP
                        border_width: 0

                    - button:
                        id: btn_8
                        checkable: true
                        width: 1
                        height: 1
                        bg_opa: TRANSP
                        border_width: 0

        # -------------------------
        # CARD 1: pH
        # -------------------------
        - obj:
            id: card_pool_ph
            grid_cell_column_pos: 0
            grid_cell_row_pos: 1
            grid_cell_x_align: CENTER
            grid_cell_y_align: CENTER
            width: 200
            height: 74
            radius: 24
            bg_color: 0x172033
            border_width: 2
            border_color: 0x24324D
            pad_top: 8
            pad_bottom: 8
            pad_left: 12
            pad_right: 12
            scrollable: false
            scrollbar_mode: "OFF"

            widgets:
              - label:
                  text: "pH"
                  align: TOP_LEFT
                  text_color: 0x94A3B8

              - label:
                  id: lbl_pool_ph_value
                  text: "--.--"
                  align: CENTER
                  y: 6
                  text_color: 0xE2E8F0
                  text_font: font_value

        # -------------------------
        # CARD 2: ORP
        # -------------------------
        - obj:
            id: card_pool_orp
            grid_cell_column_pos: 1
            grid_cell_row_pos: 1
            grid_cell_x_align: CENTER
            grid_cell_y_align: CENTER
            width: 200
            height: 74
            radius: 24
            bg_color: 0x172033
            border_width: 2
            border_color: 0x24324D
            pad_top: 8
            pad_bottom: 8
            pad_left: 12
            pad_right: 12
            scrollable: false
            scrollbar_mode: "OFF"

            widgets:
              - label:
                  text: "ORP"
                  align: TOP_LEFT
                  text_color: 0x94A3B8

              - label:
                  id: lbl_pool_orp_value
                  text: "--- mV"
                  align: CENTER
                  y: 6
                  text_color: 0xE2E8F0
                  text_font: font_value

        # -------------------------
        # CARD 3: Water Temperature
        # -------------------------
        - obj:
            id: card_pool_temp
            grid_cell_column_pos: 0
            grid_cell_row_pos: 2
            grid_cell_column_span: 2
            grid_cell_x_align: CENTER
            grid_cell_y_align: CENTER
            width: 435
            height: 74
            radius: 24
            bg_color: 0x172033
            border_width: 2
            border_color: 0x24324D
            pad_top: 8
            pad_bottom: 8
            pad_left: 12
            pad_right: 12
            scrollable: false
            scrollbar_mode: "OFF"

            widgets:
              - label:
                  text: "Temperature"
                  align: TOP_LEFT
                  text_color: 0x94A3B8

              - label:
                  id: lbl_pool_temp_value
                  text: "--.- °C"
                  align: CENTER
                  y: 2
                  text_color: 0xE2E8F0
                  text_font: font_big

        # -------------------------
        # BUTTON 1: Circulation Pump
        # -------------------------
        - button:
            id: btn_pool_circulation
            checkable: true
            grid_cell_column_pos: 0
            grid_cell_row_pos: 3
            grid_cell_x_align: CENTER
            grid_cell_y_align: CENTER
            width: 200
            height: 74
            radius: 24
            bg_color: 0x172033
            border_width: 2
            border_color: 0x24324D
            checked:
              bg_color: 0x166534
              border_color: 0x22C55E

            on_click:
              then:
                - switch.toggle: sw_pool_circulation

            widgets:
              - label:
                  text: "Circulation"
                  align: TOP_MID
                  y: 10
                  text_color: 0x94A3B8

              - label:
                  id: lbl_pool_circulation_state
                  text: "OFF"
                  align: CENTER
                  y: 8
                  text_color: 0xE2E8F0

        # -------------------------
        # BUTTON 2: Heat Pump
        # -------------------------
        - button:
            id: btn_pool_heatpump
            checkable: true
            grid_cell_column_pos: 1
            grid_cell_row_pos: 3
            grid_cell_x_align: CENTER
            grid_cell_y_align: CENTER
            width: 200
            height: 74
            radius: 24
            bg_color: 0x172033
            border_width: 2
            border_color: 0x24324D
            checked:
              bg_color: 0x166534
              border_color: 0x22C55E

            on_click:
              then:
                - switch.toggle: sw_pool_heatpump

            widgets:
              - label:
                  text: "Heat pump"
                  align: TOP_MID
                  y: 10
                  text_color: 0x94A3B8

              - label:
                  id: lbl_pool_heatpump_state
                  text: "OFF"
                  align: CENTER
                  y: 8
                  text_color: 0xE2E8F0