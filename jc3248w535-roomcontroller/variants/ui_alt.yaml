font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 56
    bpp: 4

lvgl:
  draw_rounding: 22
  displays: my_display
  touchscreens: my_touch

  bg_color: 0x0B1220
  border_width: 0
  outline_width: 0

  pages:
    - id: main_page
      layout:
        type: grid
        grid_columns: [235, 235]
        grid_rows: [34, 130, 130]
        grid_column_align: CENTER
        grid_row_align: CENTER

      widgets:
        # TOP BAR
        - obj:
            id: top_bar
            grid_cell_column_pos: 0
            grid_cell_row_pos: 0
            grid_cell_column_span: 2
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH

            bg_color: 0x0B1220
            border_width: 0
            pad_left: 14
            pad_right: 14
            pad_top: 10
            pad_bottom: 6

            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_BETWEEN
              flex_align_cross: CENTER
              flex_align_track: CENTER

            widgets:
              - label:
                  id: lbl_time
                  text: "--:--"
                  text_color: 0xE5E7EB

              - obj:
                  bg_opa: TRANSP
                  border_width: 0
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: END
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                  widgets:
                    - label:
                        id: lbl_temp
                        text: "--.-°C"
                        text_color: 0xE5E7EB
                    - label:
                        id: lbl_hum
                        text: "--%"
                        text_color: 0x9CA3AF

        # CARD 1: EVCC
        - button:
            id: btn_1
            checkable: true
            grid_cell_column_pos: 0
            grid_cell_row_pos: 1
            width: 210
            height: 110
            radius: 26
            bg_color: 0x111827
            bg_opa: 220
            border_width: 1
            border_color: 0x1F2937
            checked:
              bg_color: 0x0B3B2E
              border_color: 0x22C55E

            on_click:
              then:
                - homeassistant.service:
                    service: select.select_next
                    data:
                      entity_id: select.evcc_openwb_mode

            widgets:
              - label:
                  text: "EVCC"
                  align: TOP_LEFT
                  x: 14
                  y: 10
                  text_color: 0x9CA3AF

              - label:
                  id: lbl_evcc_mode
                  text: "--"
                  align: LEFT_MID
                  x: 14
                  y: -4
                  text_color: 0xE5E7EB

              - label:
                  id: lbl_charge_kw
                  text: "--.- kW"
                  align: RIGHT_MID
                  x: -14
                  y: -4
                  text_color: 0xE5E7EB

              - bar:
                  id: bar_charge
                  align: BOTTOM_MID
                  y: -12
                  width: 184
                  height: 14
                  min_value: 0
                  max_value: 12000
                  value: 0
                  bg_color: 0x0B1220
                  indicator:
                    bg_color: 0x22C55E

        # CARD 2: Küche Reinigung
        - button:
            id: btn_2
            checkable: true
            grid_cell_column_pos: 1
            grid_cell_row_pos: 1
            width: 210
            height: 110
            radius: 26
            bg_color: 0x111827
            bg_opa: 220
            border_width: 1
            border_color: 0x1F2937
            checked:
              bg_color: 0x1E3A8A
              border_color: 0x3B82F6

            on_click:
              then:
                - homeassistant.service:
                    service: input_button.press
                    data:
                      entity_id: input_button.reinigung_kuche

            widgets:
              - label:
                  text: "Kueche"
                  align: TOP_LEFT
                  x: 14
                  y: 10
                  text_color: 0x9CA3AF
              - label:
                  text: "Reinigung"
                  align: LEFT_MID
                  x: 14
                  y: -2
                  text_color: 0xE5E7EB

        # TILE 3/4: freie Switches
        - button:
            id: btn_3
            checkable: true
            grid_cell_column_pos: 0
            grid_cell_row_pos: 2
            width: 210
            height: 110
            radius: 26
            bg_color: 0x111827
            bg_opa: 220
            border_width: 1
            border_color: 0x1F2937
            checked:
              bg_color: 0x0B3B2E
              border_color: 0x22C55E
            widgets:
              - label:
                  text: "3"
                  align: CENTER
                  text_color: 0xE5E7EB
                  text_font: font_big

        - button:
            id: btn_4
            checkable: true
            grid_cell_column_pos: 1
            grid_cell_row_pos: 2
            width: 210
            height: 110
            radius: 26
            bg_color: 0x111827
            bg_opa: 220
            border_width: 1
            border_color: 0x1F2937
            checked:
              bg_color: 0x0B3B2E
              border_color: 0x22C55E
            widgets:
              - label:
                  text: "4"
                  align: CENTER
                  text_color: 0xE5E7EB
                  text_font: font_big

        # Reserve Buttons (btn_5..btn_8)
        - button:
            id: btn_5
            checkable: true
            align: TOP_LEFT
            x: 0
            y: 0
            width: 1
            height: 1
            bg_opa: TRANSP
            border_width: 0

        - button:
            id: btn_6
            checkable: true
            align: TOP_LEFT
            x: 0
            y: 0
            width: 1
            height: 1
            bg_opa: TRANSP
            border_width: 0

        - button:
            id: btn_7
            checkable: true
            align: TOP_LEFT
            x: 0
            y: 0
            width: 1
            height: 1
            bg_opa: TRANSP
            border_width: 0

        - button:
            id: btn_8
            checkable: true
            align: TOP_LEFT
            x: 0
            y: 0
            width: 1
            height: 1
            bg_opa: TRANSP
            border_width: 0
