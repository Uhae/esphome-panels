binary_sensor:
  - platform: homeassistant
    id: ha_j
    entity_id: input_boolean.jc_j
    on_state:
      then:
        - lambda: 'id(sync_from_ha)=true;'
        - if:
            condition:
              binary_sensor.is_on: ha_j
            then:
              - switch.turn_on: sw_j
            else:
              - switch.turn_off: sw_j
        - lambda: 'id(sync_from_ha)=false;'

  - platform: homeassistant
    id: ha_o
    entity_id: input_boolean.jc_o
    on_state:
      then:
        - lambda: 'id(sync_from_ha)=true;'
        - if:
            condition:
              binary_sensor.is_on: ha_o
            then:
              - switch.turn_on: sw_o
            else:
