# variants/ui_josi.yaml
# Teenager-Style UI Experiment (UI only). Hardware remains stable/mipi_spi.

time:
  - platform: homeassistant
    id: ha_time

interval:
  - interval: 30s
    then:
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            char buf[6];
            snprintf(buf, sizeof(buf), "%02d:%02d", now.hour, now.minute);
            return std::string(buf);

sensor:
  - platform: homeassistant
    id: outdoor_temp
    entity_id: sensor.weather_station_indoor_outdoor_module_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_outdoor_temp
            text: !lambda |-
              if (!id(outdoor_temp).has_state()) return std::string("--.-°C");
              char buf[10];
              snprintf(buf, sizeof(buf), "%.1f°C", id(outdoor_temp).state);
              return std::string(buf);



# Deterministic button state: subscribe to the *underlying HA entities* and
# drive the LVGL "checked" state from their current HA state.
#
# NOTE:
# - For J/O/S, replace the entity_id values with the actual HA entities you want to mirror.
# - For I, this is already set to the light from your example automation.
text_sensor:
  - platform: homeassistant
    id: ha_state_j
    entity_id: light.licht_josi
    on_value:
      then:
        - lvgl.widget.update:
            id: btn_j
            state:
              checked: !lambda 'return x == "on";'

  - platform: homeassistant
    id: ha_state_o
    entity_id: light.led_josi
    on_value:
      then:
        - lvgl.widget.update:
            id: btn_o
            state:
              checked: !lambda 'return x == "on";'

  - platform: homeassistant
    id: ha_state_s
    entity_id: light.ikea_of_sweden_tradfribulbe27wsglobeclear806lm
    on_value:
      then:
        - lvgl.widget.update:
            id: btn_s
            state:
              checked: !lambda 'return x == "on";'

  - platform: homeassistant
    id: ha_state_i
    entity_id: light.ikea_of_sweden_tradfri_bulb_e27_cws_globe_806lm_2
    on_value:
      then:
        - lvgl.widget.update:
            id: btn_i
            state:
              checked: !lambda 'return x == "on";'

lvgl:
  bg_color: 0x0B1220
  border_width: 0
  outline_width: 0
  scrollbar_mode: "OFF"

  pages:
    - id: main_page
      layout:
        type: grid
        grid_columns: [468]
        grid_rows: [56, 252]
        pad_row: 12
        pad_column: 0

      widgets:
        - obj:
            id: topbar
            grid_cell_column_pos: 0
            grid_cell_row_pos: 0
            width: 468
            align: TOP_MID
            height: 56
            bg_color: 0x0F172A
            bg_opa: 90%
            radius: 18
            pad_left: 18
            pad_right: 18
            pad_top: 10
            pad_bottom: 10
            scrollbar_mode: "OFF"

            widgets:
              - label:
                  id: lbl_clock
                  align: LEFT_MID
                  text: "--:--"
                  text_font: montserrat_32
                  text_color: 0xE5E7EB

              - label:
                  id: lbl_outdoor_temp
                  align: RIGHT_MID
                  text: "--.-°C"
                  text_font: montserrat_18
                  text_color: 0x94A3B8


        - obj:
            id: button_row
            grid_cell_column_pos: 0
            grid_cell_row_pos: 1
            width: 468
            height: 252
            bg_opa: TRANSP
            scrollbar_mode: "OFF"

            layout:
              type: grid
              grid_columns: [96, 96, 96, 96]
              grid_rows: [96]
              pad_column: 12
              pad_row: 0
              grid_column_align: CENTER
              grid_row_align: CENTER

            widgets:
              - button:
                  id: btn_j
                  grid_cell_column_pos: 0
                  grid_cell_row_pos: 0
                  width: 96
                  height: 96
                  radius: 18
                  checkable: false
                  bg_color: 0x1F2937
                  bg_opa: 100%
                  checked:
                    bg_color: 0x3B82F6

                  on_click:
                    then:
                      - switch.toggle: sw_j

                  widgets:
                    - label:
                        text: "J"
                        align: CENTER
                        text_font: montserrat_36
                        text_color: 0xE5E7EB


              - button:
                  id: btn_o
                  grid_cell_column_pos: 1
                  grid_cell_row_pos: 0
                  width: 96
                  height: 96
                  radius: 18
                  checkable: false
                  bg_color: 0x1F2937
                  bg_opa: 100%
                  checked:
                    bg_color: 0x8B5CF6

                  on_click:
                    then:
                      - switch.toggle: sw_o

                  widgets:
                    - label:
                        text: "O"
                        align: CENTER
                        text_font: montserrat_36
                        text_color: 0xE5E7EB


              - button:
                  id: btn_s
                  grid_cell_column_pos: 2
                  grid_cell_row_pos: 0
                  width: 96
                  height: 96
                  radius: 18
                  checkable: false
                  bg_color: 0x1F2937
                  bg_opa: 100%
                  checked:
                    bg_color: 0x14B8A6

                  on_click:
                    then:
                      - switch.toggle: sw_s

                  widgets:
                    - label:
                        text: "S"
                        align: CENTER
                        text_font: montserrat_36
                        text_color: 0xE5E7EB


              - button:
                  id: btn_i
                  grid_cell_column_pos: 3
                  grid_cell_row_pos: 0
                  width: 96
                  height: 96
                  radius: 18
                  checkable: false
                  bg_color: 0x1F2937
                  bg_opa: 100%
                  checked:
                    bg_color: 0xF59E0B

                  on_click:
                    then:
                      - switch.toggle: sw_i

                  widgets:
                    - label:
                        text: "I"
                        align: CENTER
                        text_font: montserrat_36
                        text_color: 0xE5E7EB



switch:
  # These switches exist mainly as "tap inputs" for Home Assistant automations.
  # They are intentionally NOT bound to the LVGL widgets anymore, so the UI can
  # reflect the *real device state* (via text_sensor above) without causing
  # automation feedback loops.
  - platform: template
    name: "JC J"
    id: sw_j
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - homeassistant.service:
          service: input_boolean.turn_on
          data:
            entity_id: input_boolean.jc_j
    turn_off_action:
      - homeassistant.service:
          service: input_boolean.turn_off
          data:
            entity_id: input_boolean.jc_j

  - platform: template
    name: "JC O"
    id: sw_o
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - homeassistant.service:
          service: input_boolean.turn_on
