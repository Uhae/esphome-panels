esphome:
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - script.execute: ui_refresh_topbar

interval:
  - interval: 30s
    then:
      - script.execute: ui_refresh_topbar

script:
  - id: ui_refresh_topbar
    mode: queued
    then:
      - lvgl.label.update:
          id: lbl_time_stable
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            char buf[6];
            snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
            return std::string(buf);

      - lvgl.label.update:
          id: lbl_time_pool
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            char buf[6];
            snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
            return std::string(buf);

      - lvgl.label.update:
          id: lbl_temp_stable
          text: !lambda |-
            if (!id(indoor_temp).has_state()) return std::string("--.-°C");
            char buf[10];
            snprintf(buf, sizeof(buf), "%.1f°C", id(indoor_temp).state);
            return std::string(buf);

      - lvgl.label.update:
          id: lbl_hum_stable
          text: !lambda |-
            if (!id(indoor_hum).has_state()) return std::string("--%");
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f%%", id(indoor_hum).state);
            return std::string(buf);