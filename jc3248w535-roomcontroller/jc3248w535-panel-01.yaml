esphome:
  name: jc3248w535-panel_01
  friendly_name: jc3248w535-panel_01
  platformio_options:
    upload_speed: 921600
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - script.execute: ui_refresh_topbar



esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

logger:
  baud_rate: 921600

api:
  encryption:
    key: !secret JC3248W535EN_01_api_key

ota:
  - platform: esphome
    password: !secret JC3248W535EN_01_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: True

# ------------------------------------------------------------
# Home Assistant Time + Data Sources
# ------------------------------------------------------------
time:
  - platform: homeassistant
    id: ha_time

sensor:
  - platform: homeassistant
    id: indoor_temp
    entity_id: sensor.weather_station_indoor_temperature

  - platform: homeassistant
    id: indoor_hum
    entity_id: sensor.weather_station_indoor_humidity

  - platform: homeassistant
    id: charge_power
    entity_id: sensor.evcc_openwb_charge_power
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_charge_kw
            text: !lambda |-
              // Robust: Sensor kann W oder kW liefern
              float v = id(charge_power).state;
              float w = (v <= 20.0f) ? (v * 1000.0f) : v;
              if (w < 0) w = 0;
              if (w > 12000) w = 12000;

              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f kW", w / 1000.0f);
              return std::string(buf);

        - lvgl.bar.update:
            id: bar_charge
            value: !lambda |-
              float v = id(charge_power).state;
              float w = (v <= 20.0f) ? (v * 1000.0f) : v;
              if (w < 0) w = 0;
              if (w > 12000) w = 12000;
              return (int) w;



text_sensor:
  - platform: homeassistant
    id: evcc_mode
    entity_id: select.evcc_openwb_mode
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_evcc_mode
            text: !lambda |-
              return id(evcc_mode).state;


# Refresh Top-Bar regelmäßig
interval:
  - interval: 30s
    then:
      - script.execute: ui_refresh_topbar

# ------------------------------------------------------------
# Display + Touch (working config)
# ------------------------------------------------------------
spi:
  id: display_qspi
  type: quad
  clk_pin: 47
  data_pins: [21, 48, 40, 39]

i2c:
  sda: 4
  scl: 8
  id: touchscreen_bus

display:
  - platform: qspi_dbi
    model: axs15231
    data_rate: 40MHz
    id: my_display
    spi_id: display_qspi
    dimensions:
      height: 480
      width: 320
    cs_pin: 45
    rotation: 90
    auto_clear_enabled: false

output:
  - platform: ledc
    pin: GPIO1
    id: backlight

light:
  - platform: monochromatic
    output: backlight
    name: "backlight Light"
    restore_mode: ALWAYS_ON

touchscreen:
  - platform: axs15231
    id: my_touch
    display: my_display
    i2c_id: touchscreen_bus

    # FIX nach ESPHome 2025.12.7 Update (bei dir bestätigt funktionierend)
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: true

    calibration:
      x_min: 14
      x_max: 461
      y_min: 12
      y_max: 310

    # Optional: Touch Debug (DEBUG statt WARN, damit Logs nicht zugemüllt werden)
    on_touch:
      - logger.log:
          level: DEBUG
          format: "TOUCH: x=%d y=%d | RAW: rx=%d ry=%d"
          args: ["touch.x", "touch.y", "touch.x_raw", "touch.y_raw"]

# ------------------------------------------------------------
# Generic Switches (Button 3/4 bleiben frei belegbar in HA)
# ------------------------------------------------------------

font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 56
    bpp: 4

switch:
  - platform: lvgl
    widget: btn_3
    name: "Panel Switch 1"
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: lvgl
    widget: btn_4
    name: "Panel Switch 2"
    restore_mode: RESTORE_DEFAULT_OFF

# ------------------------------------------------------------
# LVGL UI – Room Controller V1 (Top-Bar + 4 Buttons)
# (passt ohne Scroll auf 480x320 Landscape)
# ------------------------------------------------------------
lvgl:
  draw_rounding: 16
  displays: my_display
  touchscreens: my_touch

  bg_color: 0xF2F3F5
  border_width: 0
  outline_width: 0

  pages:
    - id: main_page
      layout:
        type: grid
        grid_columns: [235, 235]
        grid_rows: [30, 130, 130]
        grid_column_align: CENTER
        grid_row_align: CENTER

      widgets:
        # -------------------------
        # TOP BAR
        # -------------------------
        - obj:
            id: top_bar
            grid_cell_column_pos: 0
            grid_cell_row_pos: 0
            grid_cell_column_span: 2
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH

            bg_color: 0xF2F3F5
            border_width: 0
            pad_left: 12
            pad_right: 12
            pad_top: 8
            pad_bottom: 8

            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_BETWEEN
              flex_align_cross: CENTER
              flex_align_track: CENTER

            widgets:
              - label:
                  id: lbl_time
                  text: "--:--"
                  text_color: 0x111827

              - obj:
                  bg_opa: TRANSP
                  border_width: 0
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: END
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                  widgets:
                    - label:
                        id: lbl_temp
                        text: "--.-°C"
                        text_color: 0x111827
                    - label:
                        id: lbl_hum
                        text: "--%"
                        text_color: 0x6B7280

        # -------------------------
        # BUTTON 1: EVCC Mode Cycle
        # -------------------------
        - button:
            id: btn_1
            grid_cell_column_pos: 0
            grid_cell_row_pos: 1
            grid_cell_x_align: CENTER
            grid_cell_y_align: CENTER
            width: 200
            height: 100
            radius: 24
            bg_color: 0x172033
            border_width: 2
            border_color: 0x24324D

            on_click:
              then:
                - homeassistant.service:
                    service: select.select_next
                    data:
                      entity_id: select.evcc_openwb_mode
                      

            widgets:
            # Titel oben
              - label:
                  text: "EVCC"
                  align: TOP_MID
                  y: 6 
                  text_color: 0x94A3B8

  # Zeile: links Modus, rechts Leistung
              - obj:
                  id: row_evcc
                  align: CENTER
                  y: -8
                  width: 200
                  height: 34
                  bg_opa: TRANSP
                  border_width: 0
                  pad_left: 8
                  pad_right: 8
                  scrollable: false
                  scrollbar_mode: "OFF"
                  clickable: false
                  event_bubble: true

                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER
                    flex_align_track: CENTER

                  widgets:
                    - label:
                        id: lbl_evcc_mode
                        text: "--"
                        text_color: 0xE2E8F0
                        clickable: false

                    - label:
                        id: lbl_charge_kw
                        text: "--.- kW"
                        text_color: 0xE2E8F0
                        clickable: false

              # Balken unten
              - bar:
                  id: bar_charge
                  align: BOTTOM_MID
                  y: -14
                  width: 190
                  height: 16
                  min_value: 0
                  max_value: 12000
                  value: 0
                  bg_color: 0xE5E7EB
                  indicator:
                    bg_color: 0x3B82F6



        # -------------------------
        # BUTTON 2: Küche Reinigung (Push)
        # -------------------------
        - button:
            id: btn_2
            grid_cell_column_pos: 1
            grid_cell_row_pos: 1
            grid_cell_x_align: CENTER
            grid_cell_y_align: CENTER
            width: 200
            height: 100
            radius: 24
            bg_color: 0x172033
            border_width: 2
            border_color: 0x24324D

            on_click:
              then:
                - homeassistant.service:
                    service: input_button.press
                    data:
                      entity_id: input_button.reinigung_kuche

            widgets:
              - label:
                  text: "Kueche"
                  align: TOP_MID
                  y: 18
                  text_color: 0x94A3B8
              - label:
                  text: "Reinigung"
                  align: CENTER
                  text_color: 0xE2E8F0

        # -------------------------
        # BUTTON 3: Generic Switch 1
        # -------------------------
        - button:
            id: btn_3
            grid_cell_column_pos: 0
            grid_cell_row_pos: 2
            grid_cell_x_align: CENTER
            grid_cell_y_align: CENTER
            width: 200
            height: 100
            radius: 24
            checkable: true
            bg_color: 0x172033
            border_width: 2
            border_color: 0x24324D
            checked:
              bg_color: 0x1E40AF
              border_color: 0x3B82F6
            widgets:
              - label:
                  text: "1"
                  align: CENTER
                  text_color: 0xE2E8F0
                  text_font: font_big


        # -------------------------
        # BUTTON 4: Generic Switch 2
        # -------------------------
        - button:
            id: btn_4
            grid_cell_column_pos: 1
            grid_cell_row_pos: 2
            grid_cell_x_align: CENTER
            grid_cell_y_align: CENTER
            width: 200
            height: 100
            radius: 24
            checkable: true
            bg_color: 0x172033
            border_width: 2
            border_color: 0x24324D
            checked:
              bg_color: 0x1E40AF
              border_color: 0x3B82F6
            widgets:
              - label:
                  text: "2"
                  align: CENTER
                  text_color: 0xE2E8F0
                  text_font: font_big


# ------------------------------------------------------------
# UI Refresh Script (Top-Bar + EVCC Label)
# ------------------------------------------------------------
script:
  - id: ui_refresh_topbar
    mode: queued
    then:
      # Uhrzeit
      - lvgl.label.update:
          id: lbl_time
          text: !lambda |-
            auto t = id(ha_time).now();
            char buf[6];
            snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
            return std::string(buf);

      # Temperatur
      - lvgl.label.update:
          id: lbl_temp
          text: !lambda |-
            if (!id(indoor_temp).has_state()) return std::string("--.-°C");
            char buf[10];
            snprintf(buf, sizeof(buf), "%.1f°C", id(indoor_temp).state);
            return std::string(buf);

      # Luftfeuchte
      - lvgl.label.update:
          id: lbl_hum
          text: !lambda |-
            if (!id(indoor_hum).has_state()) return std::string("--%");
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f%%", id(indoor_hum).state);
            return std::string(buf);

      # EVCC Mode Text
      - lvgl.label.update:
          id: lbl_evcc_mode
          text: !lambda |-
            if (!id(evcc_mode).has_state()) return std::string("--");
            return id(evcc_mode).state;



