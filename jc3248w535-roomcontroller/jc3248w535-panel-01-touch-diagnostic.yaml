        bg_color: 0x38BDF8
        border_width: 0
    - lvgl.canvas.draw_text:
        id: diag_canvas
        x: 53
        y: 151
        text: "4"
        max_width: 20
        color: 0xF8FAFC
    - lvgl.canvas.draw_rectangle:
        id: diag_canvas
        x: 231
        y: 151
        width: 19
        height: 19
        radius: 9
        bg_color: 0x38BDF8
        border_width: 0
    - lvgl.canvas.draw_text:
        id: diag_canvas
        x: 253
