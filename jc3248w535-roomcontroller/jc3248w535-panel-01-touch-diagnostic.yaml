    - lvgl.canvas.draw_rectangle:
        id: diag_canvas
        x: 231
        y: 256
        width: 19
        height: 19
        radius: 9
        bg_color: 0x38BDF8
        border_width: 0
    - lvgl.canvas.draw_text:
