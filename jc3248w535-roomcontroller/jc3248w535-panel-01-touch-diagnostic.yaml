      widgets:
        - canvas:
            id: diag_canvas
            align: CENTER
            width: 480
            height: 320
            transparent: false
        - label:
            align: TOP_MID
            id: diag_readout
            y: 4
            text: "TOUCH DIAG V2: tap 1 to 9"
            text_color: 0xFFFFFF
            bg_color: 0x0B1220
            bg_opa: COVER
        - label:
            align: BOTTOM_MID
            y: -1
            text: "BLUE targets / RED reported points"
            text_color: 0xFFFFFF
            bg_color: 0x0B1220
            bg_opa: COVER
