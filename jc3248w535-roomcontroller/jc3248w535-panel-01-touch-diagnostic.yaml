# JC3248W535 touch diagnostic v2 (experimental), ESPHome 2026.9.0.
# Coordinate test only. The x/y calibration is provisional and requires
# a physical 9-point re-test; do not use it to control Home Assistant devices.
# Isolated by design: NO Home Assistant source entities, switches,
# controls, EVCC, Pool, Roborock, automations or HA service calls.
# Do not merge this firmware into the production panel configuration.
# Same device name/IP/API/OTA credentials as the real panel on purpose;
# a separately authorized OTA replaces its dashboard temporarily.
substitutions:
  device_ip: "192.168.2.171"

esphome:
  name: jc3248w535-panel-01
  friendly_name: "JC Panel Touch Diagnostic"

packages:
  base: !include common/base.yaml
  net: !include common/network.yaml

# Hardware copied from the already validated ESPHome 2026.9
# rotation migration, intentionally retaining original touch settings.
# ------------------------------------------------------------
# Display + Touch (working config)
# ------------------------------------------------------------
spi:
  id: display_qspi
  type: quad
  clk_pin: 47
  data_pins: [21, 48, 40, 39]

i2c:
  sda: 4
  scl: 8
  id: touchscreen_bus

display:
  - platform: qspi_dbi
    model: axs15231
    data_rate: 40MHz
    id: my_display
    spi_id: display_qspi
    dimensions:
      height: 480
      width: 320
    cs_pin: 45
    auto_clear_enabled: false

output:
  - platform: ledc
    pin: GPIO1
    id: backlight

light:
  - platform: monochromatic
    output: backlight
    name: "backlight Light"
    restore_mode: ALWAYS_ON

touchscreen:
  - platform: axs15231
    id: my_touch
    display: my_display
    i2c_id: touchscreen_bus

    # 2026.9.0 provisional correction based on nine on-device raw taps.
    # This firmware does NOT control any external devices.
    # LVGL rotation=90 maps native driver (x,y) to (y,319-x).
    # For this touchscreen, the previous swap_xy causes a second axis swap.
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

    # Empirical first-pass; x_min/y_min cannot be negative in ESPHome.
    # Expected remaining errors: up to ~27 px near left/bottom edges.
    # Do NOT promote to dashboard until observed touch accuracy passes.
    calibration:
      x_min: 0
      x_max: 287
      y_min: 0
      y_max: 487


    # Only local logging and visual feedback. NO Home Assistant commands.
    on_touch:
      - lambda: |-
          ESP_LOGI("touch_diag", "TAP drv_x=%d drv_y=%d lvgl_x=%d lvgl_y=%d raw_x=%d raw_y=%d",
                   touch.x, touch.y, touch.y, 319 - touch.x, touch.x_raw, touch.y_raw);
      - lvgl.canvas.draw_rectangle:
          id: diag_canvas
          # Always draw at the coordinates actually passed to LVGL,
          # NOT at touchscreen on_touch's pre-rotation driver coordinates.
          x: !lambda "return touch.y > 5 ? touch.y - 5 : 0;"
          y: !lambda "return touch.x < 314 ? 314 - touch.x : 0;"
          width: 11
          height: 11
          radius: 5
          bg_color: 0xEF4444
          border_width: 0
      - lvgl.label.update:
          id: diag_readout
          text: !lambda |-
            char buf[95];
            snprintf(buf, sizeof(buf), "LVGL %d,%d | DRV %d,%d | RAW %d,%d",
                     touch.y, 319 - touch.x, touch.x, touch.y,
                     touch.x_raw, touch.y_raw);
            return std::string(buf);

lvgl:
  rotation: 90
  displays: my_display
  touchscreens: my_touch
  draw_rounding: 16
  bg_color: 0x0B1220
  border_width: 0
  on_boot:
    - lvgl.canvas.fill:
        id: diag_canvas
        color: 0x0B1220
    - lvgl.canvas.draw_rectangle:
        id: diag_canvas
        x: 31
        y: 46
        width: 19
        height: 19
        radius: 9
        bg_color: 0x38BDF8
        border_width: 0
    - lvgl.canvas.draw_text:
        id: diag_canvas
        x: 53
        y: 46
        text: "1"
        max_width: 20
        color: 0xF8FAFC
    - lvgl.canvas.draw_rectangle:
        id: diag_canvas
        x: 231
        y: 46
        width: 19
        height: 19
        radius: 9
        bg_color: 0x38BDF8
        border_width: 0
    - lvgl.canvas.draw_text:
        id: diag_canvas
        x: 253
        y: 46
        text: "2"
        max_width: 20
        color: 0xF8FAFC
    - lvgl.canvas.draw_rectangle:
        id: diag_canvas
        x: 431
        y: 46
        width: 19
        height: 19
        radius: 9
        bg_color: 0x38BDF8
        border_width: 0
    - lvgl.canvas.draw_text:
        id: diag_canvas
        x: 453
        y: 46
        text: "3"
        max_width: 20
        color: 0xF8FAFC
    - lvgl.canvas.draw_rectangle:
        id: diag_canvas
        x: 31
        y: 151
        width: 19
        height: 19
        radius: 9
        bg_color: 0x38BDF8
        border_width: 0
    - lvgl.canvas.draw_text:
        id: diag_canvas
        x: 53
        y: 151
        text: "4"
        max_width: 20
        color: 0xF8FAFC
    - lvgl.canvas.draw_rectangle:
        id: diag_canvas
        x: 231
        y: 151
        width: 19
        height: 19
        radius: 9
        bg_color: 0x38BDF8
        border_width: 0
    - lvgl.canvas.draw_text:
        id: diag_canvas
        x: 253
        y: 151
        text: "5"
        max_width: 20
        color: 0xF8FAFC
    - lvgl.canvas.draw_rectangle:
        id: diag_canvas
        x: 431
        y: 151
        width: 19
        height: 19
        radius: 9
        bg_color: 0x38BDF8
        border_width: 0
    - lvgl.canvas.draw_text:
        id: diag_canvas
        x: 453
